name: Promote approved release to local-prod

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vMAJOR.MINOR.PATCH tag already deployed in local-qual
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-keycloak-26-app-local-prod
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    outputs:
      image-tag: ${{ steps.release.outputs.image-tag }}
      release-version: ${{ steps.release.outputs.release-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}

      - id: release
        name: Resolve and validate release
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          }
          git fetch --no-tags origin main:refs/remotes/origin/main
          image_tag="$(git rev-list -n 1 "${RELEASE_TAG}")"
          git merge-base --is-ancestor "${image_tag}" origin/main || {
            echo "Tag must reference a commit on main" >&2
            exit 1
          }
          echo "image-tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "release-version=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

  promote:
    needs: validate-release
    runs-on:
      - self-hosted
      - idm-local
    environment: local-prod
    timeout-minutes: 20
    env:
      IMAGE_REPOSITORY: localhost:5001/keycloak-26-app
      IMAGE_TAG: ${{ needs.validate-release.outputs.image-tag }}
      RELEASE_VERSION: ${{ needs.validate-release.outputs.release-version }}
    steps:
      - name: Verify image and local-qual
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Accept: application/vnd.oci.image.manifest.v1+json" \
            "http://localhost:5001/v2/keycloak-26-app/manifests/${IMAGE_TAG}" \
            >/dev/null
          test "$(kubectl get application keycloak-local-qual -n argocd -o jsonpath='{.status.sync.status}')" = Synced
          test "$(kubectl get application keycloak-local-qual -n argocd -o jsonpath='{.status.health.status}')" = Healthy

      - name: Create GitHub App token for idm-gitops
        id: gitops-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: idm-gitops
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/idm-gitops
          ref: main
          token: ${{ steps.gitops-token.outputs.token }}
          path: idm-gitops

      - name: Verify candidate and update local-prod
        run: |
          set -euo pipefail
          qual="idm-gitops/apps/keycloak/overlays/local-qual/kustomization.yaml"
          prod="idm-gitops/apps/keycloak/overlays/local-prod/kustomization.yaml"
          applicationset="idm-gitops/argocd/keycloak-applicationset.yaml"
          qual_tag="$(sed -n -E 's/^[[:space:]]*newTag:[[:space:]]*([^[:space:]]+).*/\1/p' "${qual}")"
          test "${qual_tag}" = "${IMAGE_TAG}" || {
            echo "local-qual references ${qual_tag}, not ${IMAGE_TAG}" >&2
            exit 1
          }
          sed -i -E "s/^([[:space:]]*newTag:).*/\1 ${IMAGE_TAG}/" "${prod}"

          if ! grep -q "^[[:space:]]*- environment: local-prod$" "${applicationset}"; then
            python3 - "${applicationset}" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          content = path.read_text(encoding="utf-8")
          anchor = "          - environment: local-qual\n            namespace: keycloak-qual\n"
          addition = "          - environment: local-prod\n            namespace: keycloak-prod\n"
          if anchor not in content:
              raise SystemExit("local-qual entry not found")
          path.write_text(content.replace(anchor, anchor + addition, 1), encoding="utf-8")
          PY
          fi

          kubectl kustomize idm-gitops/apps/keycloak/overlays/local-prod >/dev/null

      - name: Commit local-prod promotion
        env:
          APP_SLUG: ${{ steps.gitops-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          cd idm-gitops
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git add apps/keycloak/overlays/local-prod/kustomization.yaml argocd/keycloak-applicationset.yaml

          if git diff --cached --quiet; then
            echo "local-prod already references ${IMAGE_TAG}"
            exit 0
          fi

          git commit -m "Promote keycloak-26-app ${RELEASE_VERSION} (${IMAGE_TAG}) to local-prod"
          git pull --rebase origin main
          git push origin main

