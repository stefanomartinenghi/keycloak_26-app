name: Keycloak image CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify Keycloak image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build optimized image
        run: |
          docker build \
            --build-arg KEYCLOAK_VERSION=26.8.1 \
            --tag keycloak-26-app:ci \
            .

      - name: Verify Keycloak version
        run: docker run --rm keycloak-26-app:ci --version | grep -F "26.8.1"

